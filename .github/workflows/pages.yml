name: Deploy GitHub Pages

# Manual trigger only until the repository is public: GitHub Pages is not
# available on a private repository under GitHub Free, so every push run failed.
# Once it is public, git-flow's static-site artifact (gh-pages method) on
# demos/docs replaces this file (PORT-PLAN.md, Phase 13).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the git-flow devDependencies install from GitHub Packages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build theme-core CSS
        run: pnpm --filter @cpangular/cp-theming-core build

      - name: Build theme-ng-material CSS
        run: pnpm --filter @cpangular/cp-theming-ng-material build

      - name: Build docs app
        run: npx ng build docs --configuration production

      - name: Copy index.html → 404.html (SPA deep-link support)
        run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
