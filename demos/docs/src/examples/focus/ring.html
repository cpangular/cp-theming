<!-- each ring is drawn in its own palette's focus colour -->
<span palette="primary" bg shape="full"
      style="outline: 3px solid var(--palette-color--focus); outline-offset: 3px">primary</span>
<span palette="secondary" bg shape="full"
      style="outline: 3px solid var(--palette-color--focus); outline-offset: 3px">secondary</span>
<span palette="error" bg shape="full"
      style="outline: 3px solid var(--palette-color--focus); outline-offset: 3px">error</span>
<span palette="pass" bg shape="full"
      style="outline: 3px solid var(--palette-color--focus); outline-offset: 3px">pass</span>
