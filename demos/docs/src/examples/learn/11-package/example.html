<!-- All this app says about its colours is the attribute theme="acme". -->
<main theme="acme" palette="background" bg class="app">
  <header palette="brand" filled class="bar">Acme Orders</header>

  <section palette="surface" bg container shape="md" class="order">
    <h4>Order 1042</h4>
    <p>Three items, sent on Tuesday.</p>
    <p class="actions">
      <span palette="primary" filled shape="md" class="action">Track</span>
      <span palette="primary" outlined shape="md" class="action">Invoice</span>
      <span palette="tertiary" filled shape="sm" class="label">Gift</span>
    </p>
  </section>
</main>
