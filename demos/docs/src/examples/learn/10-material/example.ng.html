<!-- cpa-g-buttons is the Buttons example of the Components gallery. It is
     here three times, and nothing in it or around it names a colour. -->
<div class="g-scope" theme="harbour" palette="background" bg>
  <p>theme="harbour"</p>
  <cpa-g-buttons />

  <div class="g-scope" theme="ember" palette="background" bg>
    <p>theme="ember", inside harbour</p>
    <cpa-g-buttons />

    <div class="g-scope" palette="tertiary">
      <p>palette="tertiary", inside ember</p>
      <cpa-g-buttons />
    </div>
  </div>
</div>
