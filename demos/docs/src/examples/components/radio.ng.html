<mat-radio-group class="g-row" value="selected" aria-label="Choice">
  <mat-radio-button value="unselected">Unselected</mat-radio-button>
  <mat-radio-button value="selected">Selected</mat-radio-button>
  <mat-radio-button value="disabled" disabled>Disabled</mat-radio-button>
</mat-radio-group>

<mat-radio-group class="g-row" value="selected" disabled aria-label="Choice, disabled">
  <mat-radio-button value="selected">Selected, disabled</mat-radio-button>
</mat-radio-group>
