<h2 mat-dialog-title>Discard the draft?</h2>
<mat-dialog-content>The draft and its attachments are removed.</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
  <button matButton="filled" mat-dialog-close>Discard</button>
</mat-dialog-actions>
