<mat-accordion>
  <mat-expansion-panel expanded>
    <mat-expansion-panel-header>
      <mat-panel-title>Expanded</mat-panel-title>
      <mat-panel-description>Description</mat-panel-description>
    </mat-expansion-panel-header>
    <p>Content of the expanded panel.</p>
    <mat-action-row>
      <button matButton>Action</button>
    </mat-action-row>
  </mat-expansion-panel>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>Collapsed</mat-panel-title>
      <mat-panel-description>Description</mat-panel-description>
    </mat-expansion-panel-header>
    <p>Content of the collapsed panel.</p>
  </mat-expansion-panel>

  <mat-expansion-panel disabled>
    <mat-expansion-panel-header>
      <mat-panel-title>Disabled</mat-panel-title>
      <mat-panel-description>Description</mat-panel-description>
    </mat-expansion-panel-header>
    <p>Never shown.</p>
  </mat-expansion-panel>
</mat-accordion>
