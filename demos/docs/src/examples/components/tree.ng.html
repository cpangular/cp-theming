<mat-tree #tree [dataSource]="nodes" [childrenAccessor]="children">
  <!-- A leaf -->
  <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
    <button matIconButton disabled></button>
    {{ node.name }}
  </mat-tree-node>

  <!-- A node with children -->
  <mat-tree-node
    *matTreeNodeDef="let node; when: hasChildren"
    matTreeNodePadding
    matTreeNodeToggle
    isExpandable
    [isExpanded]="node.name === 'Fruit'"
  >
    <button matIconButton matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
      <mat-icon>{{ tree.isExpanded(node) ? 'expand_more' : 'chevron_right' }}</mat-icon>
    </button>
    {{ node.name }}
  </mat-tree-node>
</mat-tree>
