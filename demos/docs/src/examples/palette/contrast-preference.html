<div theme="red-brand" palette="background" bg container shape="md">
  <!-- the brand colour: white text at 3.71:1, for a title and icons -->
  <span palette="brand" filled container shape="sm">brand</span>

  <!-- tone="high": a darker red in light mode, white at 6.13:1 -->
  <span palette="brand" tone="high" filled container shape="sm">brand, high</span>

  <!-- tone="low": a lighter red in light mode; white is under 3:1, so black -->
  <span palette="brand" tone="low" filled container shape="sm">brand, low</span>
</div>
