<!doctype html>
<html lang="en">

  <body>
<!-- the same markup twice; only the theme attribute differs -->
<div theme="ocean">
  <p class="given">--color--primary</p>
  <div class="steps">
    <p class="darkest">darkest</p>
    <p class="darker">darker</p>
    <p class="dark">dark</p>
    <p class="light">light</p>
    <p class="lighter">lighter</p>
    <p class="lightest">lightest</p>
  </div>
</div>

<div theme="forest">
  <p class="given">--color--primary</p>
  <div class="steps">
    <p class="darkest">darkest</p>
    <p class="darker">darker</p>
    <p class="dark">dark</p>
    <p class="light">light</p>

  </div>
</div>
